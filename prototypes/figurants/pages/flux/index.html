<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux Insta · écran</title>
<!-- Le flux Instagram de Jim sur l'écran scène (sortie du Conducteur, scène « page ») : lu une fois, sans boucle.
     Son si le navigateur l'autorise, sinon muet (un clic sur l'écran rend le son). -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<video id="v" src="/medias-locales/flux_insta_jim.mp4" playsinline preload="auto"></video>
<script>
  const v = document.getElementById('v');
  v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  document.addEventListener('click', () => { v.muted = false; v.play().catch(() => {}); });
</script>
</body>
</html>
